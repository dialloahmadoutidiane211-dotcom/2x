<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMax - Gestionnaire de Projets Vidéo</title>
    
    <!-- Icône personnalisée pour l'écran d'accueil iOS -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%232563eb%22/><text y=%2270%22 x=%2222%22 font-size=%2255%22>🎬</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js pour la réactivité -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans" x-data="appData()" x-init="initApp()">

    <!-- ANIMATION D'ALLUMAGE (SPLASH SCREEN CINÉMATIQUE) -->
    <div x-show="isLoading" 
         x-transition:leave="transition ease-out duration-700"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-105"
         class="fixed inset-0 z-50 bg-gradient-to-b from-gray-950 via-gray-900 to-black flex flex-col items-center justify-center space-y-6">
        <div class="relative flex items-center justify-center">
            <div class="absolute w-36 h-36 bg-blue-600/30 rounded-full animate-ping"></div>
            <div class="absolute w-28 h-28 bg-purple-600/20 rounded-full animate-pulse"></div>
            <div class="relative w-24 h-24 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-3xl flex items-center justify-center shadow-2xl shadow-blue-500/50 transform hover:scale-105 transition">
                <span class="text-4xl animate-bounce">🎬</span>
            </div>
        </div>
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-extrabold tracking-widest uppercase bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500 bg-clip-text text-transparent">
                VMax Studio
            </h2>
            <p class="text-xs text-gray-400 tracking-widest uppercase">Moteur, ça tourne...</p>
        </div>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800/80 p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent cursor-pointer flex items-center space-x-2" @click="currentView = 'dashboard'">
                <span>🎬</span><span>VMax</span>
            </h1>
            <div class="flex items-center space-x-2">
                <button x-show="currentView !== 'dashboard'" @click="currentView = 'dashboard'" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl transition shadow-sm">
                    Accueil / Projets
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

        <!-- 1. TABLEAU DE BORD (DASHBOARD) -->
        <template x-if="currentView === 'dashboard'">
            <div class="space-y-6">
                <!-- Barre d'outils Sync / Export / Import -->
                <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-lg">
                    <div>
                        <h2 class="text-xl font-bold">Mes Projets Vidéo</h2>
                        <p class="text-xs text-gray-400">Gérez vos séries, mini-séries, courts et longs métrages.</p>
                    </div>
                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <button @click="exportData()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-2 rounded-xl transition flex items-center space-x-1" title="Exporter les données pour synchroniser">
                            <span>📤 Export</span>
                        </button>
                        <label class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-2 rounded-xl transition cursor-pointer flex items-center space-x-1" title="Importer un fichier de sauvegarde JSON">
                            <span>📥 Import</span>
                            <input type="file" accept=".json" class="hidden" @change="importData($event)">
                        </label>
                    </div>
                </div>

                <!-- Grille des Projets + Carte de Création intégrée -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div @click="showNewProjectModal = true" class="bg-gray-900/40 border-2 border-dashed border-gray-800 hover:border-blue-500/50 p-5 rounded-2xl cursor-pointer transition flex flex-col items-center justify-center text-center space-y-2 min-h-[160px] group">
                        <div class="w-12 h-12 rounded-full bg-blue-600/20 text-blue-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                            +
                        </div>
                        <span class="font-bold text-gray-300 group-hover:text-white transition">Nouveau Projet</span>
                        <span class="text-xs text-gray-500">Créer une série, mini-série ou film</span>
                    </div>

                    <template x-for="project in projects" :key="project.id">
                        <div @click="openProject(project)" class="bg-gray-900 border border-gray-800 hover:border-blue-500/50 p-5 rounded-2xl cursor-pointer transition shadow-sm hover:shadow-md flex flex-col justify-between min-h-[160px]">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-xs uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full"
                                        :class="{
                                            'bg-purple-900/50 text-purple-300 border border-purple-700/50': project.type === 'serie',
                                            'bg-blue-900/50 text-blue-300 border border-blue-700/50': project.type === 'mini_serie',
                                            'bg-green-900/50 text-green-300 border border-green-700/50': project.type === 'court_metrage',
                                            'bg-amber-900/50 text-amber-300 border border-amber-700/50': project.type === 'long_metrage'
                                        }"
                                        x-text="formatType(project.type)">
                                    </span>
                                    <button @click.stop="deleteProject(project.id)" class="text-gray-500 hover:text-red-400 text-sm p-1">🗑️</button>
                                </div>
                                <h3 class="text-lg font-bold text-white mb-1 truncate" x-text="project.title"></h3>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-800 text-xs text-gray-400 flex justify-between items-center">
                                <span>Ouvrir l'espace</span>
                                <span>➔</span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- 2. VUE DÉTAILLÉE DU PROJET -->
        <template x-if="currentView === 'projectDetail' && currentProject">
            <div class="space-y-6">
                <!-- Fil d'Ariane Amélioré -->
                <div class="bg-gray-900 border border-gray-800 px-4 py-3 rounded-2xl flex items-center space-x-2 text-xs sm:text-sm text-gray-400 overflow-x-auto shadow-sm">
                    <span class="cursor-pointer hover:text-white whitespace-nowrap" @click="currentView = 'dashboard'">Accueil</span>
                    <span class="text-gray-600">/</span>
                    <span class="text-white font-medium whitespace-nowrap truncate max-w-[200px]" x-text="currentProject.title"></span>
                </div>

                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-lg">
                    <h2 class="text-2xl font-bold mb-1 truncate" x-text="currentProject.title"></h2>
                    <p class="text-sm text-gray-400 capitalize" x-text="'Type : ' + formatType(currentProject.type)"></p>
                </div>

                <template x-if="currentProject.type === 'serie' || currentProject.type === 'mini_serie'">
                    <div class="space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="text-xl font-bold">Saisons et Épisodes</h3>
                            <button @click="addSeason(currentProject.id)" class="bg-gray-800 hover:bg-gray-700 text-sm px-3.5 py-2 rounded-xl transition">
                                + Ajouter une saison
                            </button>
                        </div>

                        <div class="space-y-4">
                            <template x-for="season in currentProject.seasons" :key="season.id">
                                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-4 shadow-md">
                                    <div class="flex justify-between items-center">
                                        <h4 class="font-bold text-lg text-blue-400" x-text="'Saison ' + season.seasonNumber"></h4>
                                        <button @click="addEpisode(currentProject.id, season.id)" class="text-xs bg-blue-600/20 text-blue-300 border border-blue-500/30 px-3.5 py-1.5 rounded-xl hover:bg-blue-600/30 transition">
                                            + Ajouter un épisode
                                        </button>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                        <template x-for="episode in season.episodes" :key="episode.id">
                                            <div @click="openEpisode(episode)" class="bg-gray-950 border border-gray-800 hover:border-gray-700 p-4 rounded-xl cursor-pointer transition flex justify-between items-center">
                                                <div class="overflow-hidden pr-2">
                                                    <span class="text-xs text-gray-500 block" x-text="'Épisode ' + episode.episodeNumber"></span>
                                                    <span class="font-semibold text-white block truncate max-w-[150px]" x-text="episode.title"></span>
                                                </div>
                                                <span class="text-gray-600 flex-shrink-0">➔</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <template x-if="currentProject.type === 'court_metrage' || currentProject.type === 'long_metrage'">
                    <div>
                        <div x-init="openMovieWorkspace(currentProject)"></div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 3. ESPACE DE TRAVAIL DE L'ÉPISODE -->
        <template x-if="currentView === 'episodeDetail' && currentEpisode">
            <div class="space-y-6">
                <!-- Fil d'Ariane Amélioré -->
                <div class="bg-gray-900 border border-gray-800 px-4 py-3 rounded-2xl flex items-center space-x-2 text-xs sm:text-sm text-gray-400 overflow-x-auto shadow-sm">
                    <span class="cursor-pointer hover:text-white whitespace-nowrap" @click="currentView = 'dashboard'">Accueil</span>
                    <span class="text-gray-600">/</span>
                    <span class="cursor-pointer hover:text-white whitespace-nowrap truncate max-w-[100px]" @click="currentView = 'projectDetail'" x-text="currentProject.title"></span>
                    <span class="text-gray-600">/</span>
                    <span class="text-white font-medium whitespace-nowrap truncate max-w-[100px]" x-text="currentEpisode.title"></span>
                </div>

                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl flex justify-between items-center shadow-lg">
                    <div class="overflow-hidden pr-2">
                        <h2 class="text-2xl font-bold truncate max-w-[280px] sm:max-w-xl" x-text="currentEpisode.title"></h2>
                        <p class="text-sm text-gray-400">Espace de travail : Scripts, Prompts, Rushes et Formats.</p>
                    </div>
                </div>

                <!-- SECTION A : ESPACE TEXTE -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-3 shadow-md">
                        <div class="flex justify-between items-center">
                            <label class="font-bold text-sm text-gray-300">📝 Espace Script</label>
                            <button @click="copyText(currentEpisode.script, 'script')" class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-lg transition" x-text="copiedScript ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.script" @input="saveData()" rows="10" placeholder="Rédigez ou collez votre script ici..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-3 shadow-md">
                        <div class="flex justify-between items-center">
                            <label class="font-bold text-sm text-gray-300">🤖 Espace Prompts IA</label>
                            <button @click="copyText(currentEpisode.prompts, 'prompts')" class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-lg transition" x-text="copiedPrompts ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.prompts" @input="saveData()" rows="10" placeholder="Collez vos prompts IA ici..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                </div>

                <!-- SECTION B : ESPACE MÉDIAS ORIGINAUX -->
                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl space-y-4 shadow-lg">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-lg">📁 Fichiers Originaux</h3>
                        <label class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 py-2.5 rounded-xl cursor-pointer transition shadow-md shadow-blue-600/20">
                            + Ajouter un fichier
                            <input type="file" class="hidden" @change="addMedia($event, 'original')">
                        </label>
                    </div>

                    <div class="space-y-3">
                        <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'original')" :key="media.id">
                            <div class="bg-gray-950 border border-gray-800 p-3.5 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-sm">
                                <div class="flex items-center space-x-2.5 overflow-hidden w-full sm:w-auto">
                                    <span class="text-lg flex-shrink-0" x-text="mediaIcon(media.type)"></span>
                                    <span class="font-medium text-white truncate max-w-[200px] sm:max-w-xs" x-text="media.name"></span>
                                </div>
                                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end flex-wrap gap-1.5">
                                    <button @click="previewMedia(media)" class="text-blue-300 hover:text-white bg-blue-950 hover:bg-blue-900 border border-blue-800/50 px-3 py-1.5 rounded-lg text-xs font-medium transition">Lire ▶️</button>
                                    <a :href="media.url" :download="media.name" class="text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-xs transition">Télécharger</a>
                                    <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-900/40 border border-red-900/50 px-2.5 py-1.5 rounded-lg text-xs transition">Supprimer</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="currentEpisode.mediaAssets.filter(m => m.format === 'original').length === 0">
                            <p class="text-gray-500 text-sm py-2">Aucun fichier original enregistré.</p>
                        </template>
                    </div>
                </div>

                <!-- SECTION C : FORMATS RÉSEAUX SOCIAUX -->
                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl space-y-4 shadow-lg">
                    <h3 class="font-bold text-lg">📱 Formats Réseaux Sociaux</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- TikTok -->
                        <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-pink-400">TikTok (9:16)</span>
                                <label class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
                                    + Ajouter
                                    <input type="file" class="hidden" @change="addMedia($event, 'tiktok')">
                                </label>
                            </div>
                            <div class="space-y-2">
                                <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'tiktok')" :key="media.id">
                                    <div class="bg-gray-900 p-3 rounded-xl flex flex-col space-y-2 text-xs">
                                        <div class="flex justify-between items-center">
                                            <span class="font-medium text-white truncate max-w-[170px]" x-text="media.name"></span>
                                            <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                                        </div>
                                        <div class="flex space-x-2 pt-1 border-t border-gray-800">
                                            <button @click="previewMedia(media)" class="flex-1 text-blue-300 bg-blue-950 border border-blue-800/50 py-1.5 rounded-lg text-center font-semibold">Lire ▶️</button>
                                            <a :href="media.url" :download="media.name" class="flex-1 text-gray-300 bg-gray-800 py-1.5 rounded-lg text-center font-medium">Télécharger</a>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Instagram -->
                        <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-purple-400">Instagram</span>
                                <label class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
                                    + Ajouter
                                    <input type="file" class="hidden" @change="addMedia($event, 'instagram')">
                                </label>
                            </div>
                            <div class="space-y-2">
                                <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'instagram')" :key="media.id">
                                    <div class="bg-gray-900 p-3 rounded-xl flex flex-col space-y-2 text-xs">
                                        <div class="flex justify-between items-center">
                                            <span class="font-medium text-white truncate max-w-[170px]" x-text="media.name"></span>
                                            <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                                        </div>
                                        <div class="flex space-x-2 pt-1 border-t border-gray-800">
                                            <button @click="previewMedia(media)" class="flex-1 text-blue-300 bg-blue-950 border border-blue-800/50 py-1.5 rounded-lg text-center font-semibold">Lire ▶️</button>
                                            <a :href="media.url" :download="media.name" class="flex-1 text-gray-300 bg-gray-800 py-1.5 rounded-lg text-center font-medium">Télécharger</a>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Facebook -->
                        <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-blue-400">Facebook</span>
                                <label class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
                                    + Ajouter
                                    <input type="file" class="hidden" @change="addMedia($event, 'facebook')">
                                </label>
                            </div>
                            <div class="space-y-2">
                                <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'facebook')" :key="media.id">
                                    <div class="bg-gray-900 p-3 rounded-xl flex flex-col space-y-2 text-xs">
                                        <div class="flex justify-between items-center">
                                            <span class="font-medium text-white truncate max-w-[170px]" x-text="media.name"></span>
                                            <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                                        </div>
                                        <div class="flex space-x-2 pt-1 border-t border-gray-800">
                                            <button @click="previewMedia(media)" class="flex-1 text-blue-300 bg-blue-950 border border-blue-800/50 py-1.5 rounded-lg text-center font-semibold">Lire ▶️</button>
                                            <a :href="media.url" :download="media.name" class="flex-1 text-gray-300 bg-gray-800 py-1.5 rounded-lg text-center font-medium">Télécharger</a>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- MODALE : LECTEUR / VISIONNEUSE AMÉLIORÉE -->
    <template x-if="showPreviewModal && previewMediaItem">
        <div class="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
            <div class="bg-gray-900 border border-gray-800 rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                
                <div class="flex justify-between items-center px-6 py-4 bg-gray-950/80 border-b border-gray-800">
                    <div class="flex items-center space-x-3 overflow-hidden pr-2">
                        <span class="text-2xl flex-shrink-0" x-text="mediaIcon(previewMediaItem.type)"></span>
                        <div class="overflow-hidden">
                            <h3 class="font-bold text-base text-white truncate" x-text="previewMediaItem.name"></h3>
                            <span class="text-xs text-gray-400 uppercase tracking-wider" x-text="previewMediaItem.type"></span>
                        </div>
                    </div>
                    <button @click="closePreview()" class="w-9 h-9 bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white rounded-full flex items-center justify-center transition text-lg flex-shrink-0">✕</button>
                </div>
                
                <div class="flex-1 flex items-center justify-center bg-black/70 p-6 min-h-[300px] max-h-[65vh] overflow-auto">
                    <template x-if="previewMediaItem.type === 'video'">
                        <video :src="previewMediaItem.url" controls autoplay class="max-w-full max-h-[60vh] rounded-2xl shadow-2xl border border-gray-800"></video>
                    </template>
                    <template x-if="previewMediaItem.type === 'audio'">
                        <div class="w-full max-w-md bg-gray-950 border border-gray-800 p-8 rounded-2xl flex flex-col items-center space-y-6 shadow-xl">
                            <div class="w-20 h-20 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center text-4xl animate-pulse">
                                🎵
                            </div>
                            <audio :src="previewMediaItem.url" controls autoplay class="w-full"></audio>
                        </div>
                    </template>
                    <template x-if="previewMediaItem.type === 'image'">
                        <img :src="previewMediaItem.url" class="max-w-full max-h-[60vh] object-contain rounded-2xl shadow-2xl border border-gray-800">
                    </template>
                </div>

                <div class="flex justify-between items-center px-6 py-4 bg-gray-950/80 border-t border-gray-800">
                    <span class="text-xs text-gray-500 hidden sm:inline">Lecture sécurisée VMax</span>
                    <div class="flex space-x-3 w-full sm:w-auto justify-end">
                        <a :href="previewMediaItem.url" :download="previewMediaItem.name" class="px-5 py-2.5 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center space-x-2">
                            <span>Télécharger</span>
                            <span>⬇️</span>
                        </a>
                        <button @click="closePreview()" class="px-5 py-2.5 text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl transition">
                            Fermer
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </template>

    <!-- MODALE : CRÉATION DE PROJET -->
    <template x-if="showNewProjectModal">
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl w-full max-w-md space-y-5 shadow-2xl">
                <div class="flex justify-between items-center">
                    <h3 class="text-xl font-bold">Nouveau Projet Vidéo</h3>
                    <button @click="showNewProjectModal = false" class="text-gray-400 hover:text-white">✕</button>
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-gray-400">Titre du projet</label>
                    <input type="text" x-model="newProjectTitle" placeholder="Ex: Mon Super Projet" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-gray-400">Type de projet</label>
                    <select x-model="newProjectType" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 text-white">
                        <option value="serie">Série entière</option>
                        <option value="mini_serie">Mini-série</option>
                        <option value="court_metrage">Court-métrage</option>
                        <option value="long_metrage">Long-métrage</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button @click="showNewProjectModal = false" class="px-4 py-2.5 text-xs font-semibold bg-gray-800 hover:bg-gray-700 rounded-xl transition text-gray-300">Annuler</button>
                    <button @click="createProject()" class="px-5 py-2.5 text-xs font-semibold bg-blue-600 hover:bg-blue-500 rounded-xl text-white transition shadow-lg shadow-blue-600/20">Créer le projet</button>
                </div>
            </div>
        </div>
    </template>

    <!-- LOGIQUE JAVASCRIPT (ALPINE.JS) -->
    <script>
        function appData() {
            return {
                isLoading: true,
                currentView: 'dashboard',
                projects: JSON.parse(localStorage.getItem('vmax_projects') || '[]'),
                currentProject: null,
                currentEpisode: null,
                showNewProjectModal: false,
                newProjectTitle: '',
                newProjectType: 'serie',
                copiedScript: false,
                copiedPrompts: false,
                showPreviewModal: false,
                previewMediaItem: null,

                initApp() {
                    setTimeout(() => {
                        this.isLoading = false;
                    }, 1600);
                },

                saveData() {
                    localStorage.setItem('vmax_projects', JSON.stringify(this.projects));
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.projects));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", "vmax_backup_" + Date.now() + ".json");
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                },

                importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importedProjects = JSON.parse(e.target.result);
                            if (Array.isArray(importedProjects)) {
                                this.projects = importedProjects;
                                this.saveData();
                                alert('Données importées avec succès ! Synchronisation effectuée.');
                            } else {
                                alert('Format de fichier invalide.');
                            }
                        } catch (err) {
                            alert('Erreur lors de la lecture du fichier.');
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                },

                formatType(type) {
                    const maps = {
                        'serie': 'Série entière',
                        'mini_serie': 'Mini-série',
                        'court_metrage': 'Court-métrage',
                        'long_metrage': 'Long-métrage'
                    };
                    return maps[type] || type;
                },

                createProject() {
                    if (!this.newProjectTitle.trim()) return;
                    
                    const newProj = {
                        id: Date.now().toString(),
                        title: this.newProjectTitle,
                        type: this.newProjectType,
                        seasons: []
                    };

                    if (this.newProjectType === 'serie' || this.newProjectType === 'mini_serie') {
                        newProj.seasons.push({
                            id: 's_' + Date.now(),
                            seasonNumber: 1,
                            episodes: [
                                {
                                    id: 'e_' + Date.now(),
                                    episodeNumber: 1,
                                    title: 'Épisode 1',
                                    script: '',
                                    prompts: '',
                                    mediaAssets: []
                                }
                            ]
                        });
                    } else {
                        newProj.seasons.push({
                            id: 's_film_' + Date.now(),
                            seasonNumber: 1,
                            episodes: [
                                {
                                    id: 'e_film_' + Date.now(),
                                    episodeNumber: 1,
                                    title: this.newProjectTitle,
                                    script: '',
                                    prompts: '',
                                    mediaAssets: []
                                }
                            ]
                        });
                    }

                    this.projects.push(newProj);
                    this.saveData();
                    this.newProjectTitle = '';
                    this.showNewProjectModal = false;
                },

                deleteProject(id) {
                    if (confirm('Voulez-vous vraiment supprimer ce projet ?')) {
                        this.projects = this.projects.filter(p => p.id !== id);
                        this.saveData();
                    }
                },

                openProject(project) {
                    this.currentProject = project;
                    this.currentView = 'projectDetail';
                },

                openMovieWorkspace(project) {
                    if (project.seasons[0] && project.seasons[0].episodes[0]) {
                        this.currentEpisode = project.seasons[0].episodes[0];
                        this.currentView = 'episodeDetail';
                    }
                },

                addSeason(projectId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        const nextSeasonNum = project.seasons.length + 1;
                        project.seasons.push({
                            id: 's_' + Date.now(),
                            seasonNumber: nextSeasonNum,
                            episodes: [
                                {
                                    id: 'e_' + Date.now(),
                                    episodeNumber: 1,
                                    title: 'Épisode 1',
                                    script: '',
                                    prompts: '',
                                    mediaAssets: []
                                }
                            ]
                        });
                        this.saveData();
                    }
                },

                addEpisode(projectId, seasonId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        const season = project.seasons.find(s => s.id === seasonId);
                        if (season) {
                            const nextEpNum = season.episodes.length + 1;
                            season.episodes.push({
                                id: 'e_' + Date.now(),
                                episodeNumber: nextEpNum,
                                title: 'Épisode ' + nextEpNum,
                                script: '',
                                prompts: '',
                                mediaAssets: []
                            });
                            this.saveData();
                        }
                    }
                },

                openEpisode(episode) {
                    this.currentEpisode = episode;
                    this.currentView = 'episodeDetail';
                },

                copyText(text, type) {
                    navigator.clipboard.writeText(text || '');
                    if (type === 'script') {
                        this.copiedScript = true;
                        setTimeout(() => this.copiedScript = false, 2000);
                    } else {
                        this.copiedPrompts = true;
                        setTimeout(() => this.copiedPrompts = false, 2000);
                    }
                },

                addMedia(event, format) {
                    const file = event.target.files[0];
                    if (!file) return;

                    let type = 'video';
                    if (file.type.includes('audio')) type = 'audio';
                    else if (file.type.includes('image')) type = 'image';

                    const fileUrl = URL.createObjectURL(file);

                    this.currentEpisode.mediaAssets.push({
                        id: 'm_' + Date.now(),
                        name: file.name,
                        type: type,
                        format: format,
                        url: fileUrl
                    });

                    this.saveData();
                    event.target.value = '';
                },

                deleteMedia(mediaId) {
                    this.currentEpisode.mediaAssets = this.currentEpisode.mediaAssets.filter(m => m.id !== mediaId);
                    this.saveData();
                },

                previewMedia(media) {
                    this.previewMediaItem = media;
                    this.showPreviewModal = true;
                },

                closePreview() {
                    this.showPreviewModal = false;
                    this.previewMediaItem = null;
                },

                mediaIcon(type) {
                    if (type === 'video') return '🎥';
                    if (type === 'audio') return '🎵';
                    return '🖼️';
                }
            }
        }
    </script>
</body>
</html>
