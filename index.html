<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMax - Gestionnaire de Projets Vidéo</title>
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%232563eb%22/><text y=%2270%22 x=%2222%22 font-size=%2255%22>🎬</text></svg>">
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { background-color: #030712; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; min-height: 100vh; }
        
        #splash { position: fixed; inset: 0; background: #030712; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
        #splash.hidden-splash { opacity: 0; pointer-events: none; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
        header { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #1f2937; position: sticky; top: 0; z-index: 50; padding: 12px 16px; }
        .header-content { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        
        .grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
        @media(min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

        .card { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; }
        .card:hover { border-color: #3b82f6; }
        
        button, label.btn-file { background: #1f2937; color: #f3f4f6; border: 1px solid #374151; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        button:hover, label.btn-file:hover { background: #374151; }
        .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-danger { background: #450a0a; color: #f87171; border-color: #7f1d1d; }
        
        input, select, textarea { width: 100%; background: #030712; border: 1px solid #1f2937; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; outline: none; margin-top: 6px; }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6; }

        .badge { font-size: 10px; text-transform: uppercase; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-block; letter-spacing: 0.5px; }
        .badge-serie { background: #3b0764; color: #d8b4fe; border: 1px solid #581c87; }
        .badge-mini { background: #172554; color: #93c5fd; border: 1px solid #1e40af; }
        .badge-court { background: #052e16; color: #86efac; border: 1px solid #14532d; }
        .badge-long { background: #451a03; color: #fde047; border: 1px solid #78350f; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
        .modal-box { background: #111827; border: 1px solid #1f2937; border-radius: 20px; width: 100%; max-width: 500px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-align { display: flex; align-items: center; gap: 8px; }
        .breadcrumb { background: #111827; border: 1px solid #1f2937; padding: 10px 16px; border-radius: 12px; font-size: 13px; color: #9ca3af; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
        .breadcrumb span { cursor: pointer; }
        .breadcrumb span:hover { color: #fff; }

        /* Conteneurs de lecture adaptés aux formats réseaux sociaux */
        .preview-container { background: #000; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; margin: 0 auto; position: relative; }
        .format-youtube { aspect-ratio: 16 / 9; max-height: 50vh; }
        .format-vertical { aspect-ratio: 9 / 16; max-height: 65vh; }
        .format-original { max-height: 55vh; }
    </style>
</head>
<body x-data="appData()" x-init="initApp()">

    <!-- SPLASH SCREEN -->
    <div id="splash" :class="isLoading ? '' : 'hidden-splash'">
        <div style="font-size: 48px; margin-bottom: 12px;">🎬</div>
        <h2 style="font-size: 20px; font-weight: 800; letter-spacing: 1px; color: #60a5fa; margin: 0;">VMAX STUDIO</h2>
        <p style="font-size: 12px; color: #9ca3af; margin-top: 6px;">Moteur, ça tourne...</p>
    </div>

    <!-- HEADER -->
    <header>
        <div class="header-content">
            <div class="flex-align" style="cursor: pointer;" @click="currentView = 'dashboard'">
                <div style="width: 32px; height: 32px; background: #2563eb; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px;">🎬</div>
                <span style="font-size: 18px; font-weight: 800; color: #60a5fa;">VMax</span>
            </div>
            <div class="flex-align">
                <button @click="window.location.reload()">🔄 Actualiser</button>
                <button x-show="currentView !== 'dashboard'" @click="currentView = 'dashboard'">Accueil</button>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="container">

        <!-- DASHBOARD -->
        <template x-if="currentView === 'dashboard'">
            <div style="display: flex; flex-direction: column; gap: 24px;">
                <div>
                    <h2 style="font-size: 24px; font-weight: 700; margin: 0 0 4px 0;">Mes Projets Vidéo</h2>
                    <p style="font-size: 14px; color: #9ca3af; margin: 0;">Gérez vos séries, mini-séries, courts et longs métrages.</p>
                </div>

                <div class="grid">
                    <div class="card" @click="showNewProjectModal = true" style="border-style: dashed; border-color: #3b82f6; align-items: center; justify-content: center; text-align: center; background: rgba(37, 99, 235, 0.03);">
                        <div style="width: 44px; height: 44px; background: #2563eb; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: white; margin-bottom: 8px;">+</div>
                        <div>
                            <span style="font-weight: 700; font-size: 15px; color: #fff;">Nouveau Projet</span>
                            <p style="font-size: 12px; color: #9ca3af; margin: 2px 0 0 0;">Série, film ou mini-série</p>
                        </div>
                    </div>

                    <template x-for="project in projects" :key="project.id">
                        <div class="card" @click="openProject(project)">
                            <div class="flex-between">
                                <span class="badge" 
                                    :class="{
                                        'badge-serie': project.type === 'serie',
                                        'badge-mini': project.type === 'mini_serie',
                                        'badge-court': project.type === 'court_metrage',
                                        'badge-long': project.type === 'long_metrage'
                                    }" 
                                    x-text="formatType(project.type)">
                                </span>
                                <button class="btn-danger" style="padding: 4px 8px;" @click.stop="deleteProject(project.id)">🗑️</button>
                            </div>
                            <div style="margin: 12px 0;">
                                <h3 style="font-size: 17px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" x-text="project.title"></h3>
                            </div>
                            <div style="border-top: 1px solid #1f2937; padding-top: 10px; display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af;">
                                <span>Ouvrir l'espace</span>
                                <span style="color: #60a5fa; font-weight: bold;">→</span>
                            </div>
                        </div>
                    </template>
                </div>

                <div style="background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px;">
                    <h3 style="font-size: 15px; font-weight: 700; margin: 0 0 4px 0;">🔄 Synchronisation & Sauvegarde</h3>
                    <p style="font-size: 12px; color: #9ca3af; margin: 0 0 16px 0;">Exportez ou importez vos projets sous format JSON.</p>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="btn-primary" @click="exportData()">⬇️ Exporter les données</button>
                        <label class="btn-file">
                            ⬆️ Importer une sauvegarde
                            <input type="file" accept=".json" style="display: none;" @change="importData($event)">
                        </label>
                    </div>
                </div>
            </div>
        </template>

        <!-- VUE PROJET -->
        <template x-if="currentView === 'projectDetail' && currentProject">
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="breadcrumb">
                    <span @click="currentView = 'dashboard'">Accueil</span>
                    <span>/</span>
                    <span style="color: #fff; font-weight: 600;" x-text="currentProject.title"></span>
                </div>

                <div class="card" style="min-height: auto;">
                    <div class="flex-between">
                        <div>
                            <h2 style="font-size: 20px; font-weight: 700; margin: 0;" x-text="currentProject.title"></h2>
                            <p style="font-size: 12px; color: #9ca3af; margin: 4px 0 0 0;" x-text="'Type : ' + formatType(currentProject.type)"></p>
                        </div>
                        <button @click="renameProject(currentProject)">Renommer</button>
                    </div>
                </div>

                <template x-if="currentProject.type === 'serie' || currentProject.type === 'mini_serie'">
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;">
                            <template x-for="season in currentProject.seasons" :key="season.id">
                                <button @click="activeSeasonId = season.id" 
                                        :class="activeSeasonId === season.id ? 'btn-primary' : ''"
                                        x-text="'Saison ' + season.seasonNumber">
                                </button>
                            </template>
                            <button @click="addSeason(currentProject.id)">+ Saison</button>
                        </div>

                        <template x-if="getActiveSeason()">
                            <div class="card" style="min-height: auto; gap: 16px;">
                                <div class="flex-between">
                                    <h4 style="font-size: 15px; font-weight: 700; color: #60a5fa; margin: 0;" x-text="'Saison ' + getActiveSeason().seasonNumber"></h4>
                                    <div class="flex-align">
                                        <button class="btn-danger" style="padding: 4px 8px; font-size: 11px;" @click="deleteSeason(currentProject.id, getActiveSeason().id)">Supprimer</button>
                                        <button class="btn-primary" style="padding: 4px 10px; font-size: 11px;" @click="addEpisode(currentProject.id, getActiveSeason().id)">+ Épisode</button>
                                    </div>
                                </div>

                                <div class="grid">
                                    <template x-for="episode in getActiveSeason().episodes" :key="episode.id">
                                        <div style="background: #030712; border: 1px solid #1f2937; padding: 12px 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;" @click="openEpisode(episode)">
                                            <div>
                                                <span style="font-size: 10px; color: #9ca3af;" x-text="'Épisode ' + episode.episodeNumber"></span>
                                                <div style="font-weight: 600; font-size: 14px; color: #fff;" x-text="episode.title"></div>
                                            </div>
                                            <div class="flex-align">
                                                <button class="btn-danger" style="padding: 2px 6px; font-size: 11px;" @click.stop="deleteEpisode(currentProject.id, getActiveSeason().id, episode.id)">🗑️</button>
                                                <span style="color: #60a5fa;">→</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="currentProject.type === 'court_metrage' || currentProject.type === 'long_metrage'">
                    <div x-init="openMovieWorkspace(currentProject)"></div>
                </template>
            </div>
        </template>

        <!-- ESPACE ÉPISODE -->
        <template x-if="currentView === 'episodeDetail' && currentEpisode">
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="breadcrumb">
                    <span @click="currentView = 'dashboard'">Accueil</span>
                    <span>/</span>
                    <span @click="currentView = 'projectDetail'" x-text="currentProject.title"></span>
                    <span>/</span>
                    <span style="color: #fff; font-weight: 600;" x-text="currentEpisode.title"></span>
                </div>

                <div class="card" style="min-height: auto;">
                    <div class="flex-between">
                        <div>
                            <h2 style="font-size: 20px; font-weight: 700; margin: 0;" x-text="currentEpisode.title"></h2>
                            <p style="font-size: 12px; color: #9ca3af; margin: 4px 0 0 0;">Espace de travail : Script, Prompt et Rushes.</p>
                        </div>
                        <button @click="renameEpisode(currentEpisode)">Renommer</button>
                    </div>
                </div>

                <div class="grid">
                    <div class="card" style="min-height: auto;">
                        <div class="flex-between" style="margin-bottom: 8px;">
                            <label style="font-weight: 700; font-size: 12px; color: #9ca3af; text-transform: uppercase;">Script</label>
                            <button style="padding: 2px 8px; font-size: 11px;" @click="copyText(currentEpisode.script, 'script')" x-text="copiedScript ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.script" @input="saveData()" rows="8" placeholder="Écrivez votre script ici..."></textarea>
                    </div>

                    <div class="card" style="min-height: auto;">
                        <div class="flex-between" style="margin-bottom: 8px;">
                            <label style="font-weight: 700; font-size: 12px; color: #9ca3af; text-transform: uppercase;">Prompt</label>
                            <button style="padding: 2px 8px; font-size: 11px;" @click="copyText(currentEpisode.prompts, 'prompts')" x-text="copiedPrompts ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.prompts" @input="saveData()" rows="8" placeholder="Écrivez vos prompts ici..."></textarea>
                    </div>
                </div>

                <!-- Fichiers Originaux -->
                <div class="card" style="min-height: auto;">
                    <div class="flex-between" style="margin-bottom: 12px;">
                        <h3 style="font-size: 15px; font-weight: 700; margin: 0;">📁 Fichiers Originaux</h3>
                        <label class="btn-primary" style="padding: 6px 12px; font-size: 12px;">
                            + Ajouter
                            <input type="file" style="display: none;" @change="addMedia($event, 'original')">
                        </label>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'original')" :key="media.id">
                            <div style="background: #030712; border: 1px solid #1f2937; padding: 10px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                                <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%;" x-text="media.name"></span>
                                <div class="flex-align">
                                    <button class="btn-primary" style="padding: 4px 8px; font-size: 11px;" @click="previewMedia(media)">Lire ▶️</button>
                                    <a :href="media.url" :download="media.name" style="background:#1f2937; color:#fff; padding:4px 8px; border-radius:8px; text-decoration:none; font-size:11px;">Sauver</a>
                                    <button class="btn-danger" style="padding: 4px 8px; font-size: 11px;" @click="deleteMedia(media.id)">✕</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="currentEpisode.mediaAssets.filter(m => m.format === 'original').length === 0">
                            <p style="font-size: 12px; color: #6b7280; margin: 0;">Aucun fichier original.</p>
                        </template>
                    </div>
                </div>

                <!-- Formats Réseaux Sociaux -->
                <div class="card" style="min-height: auto;">
                    <h3 style="font-size: 15px; font-weight: 700; margin: 0 0 12px 0;">📱 Formats Réseaux Sociaux</h3>
                    <div class="grid">
                        <template x-for="fmt in ['youtube', 'youtube_shorts', 'tiktok', 'instagram', 'facebook']">
                            <div style="background: #030712; border: 1px solid #1f2937; padding: 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px;">
                                <div class="flex-between">
                                    <span style="font-weight: 700; font-size: 13px; color: #60a5fa; text-transform: capitalize;" x-text="fmt.replace('_', ' ')"></span>
                                    <label style="background: #1f2937; padding: 3px 8px; font-size: 11px; border-radius: 6px; cursor: pointer;">
                                        + Ajouter
                                        <input type="file" style="display: none;" @change="addMedia($event, fmt)">
                                    </label>
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 6px;">
                                    <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === fmt)" :key="media.id">
                                        <div style="background: #111827; padding: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
                                            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%;" x-text="media.name"></span>
                                            <div class="flex-align">
                                                <button class="btn-primary" style="padding: 2px 6px; font-size: 10px;" @click="previewMedia(media)">Lire</button>
                                                <a :href="media.url" :download="media.name" style="background:#374151; color:#fff; padding:2px 6px; border-radius:6px; text-decoration:none; font-size:10px;">Sauver</a>
                                                <button class="btn-danger" style="padding: 2px 6px; font-size: 10px;" @click="deleteMedia(media.id)">✕</button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- MODALE LECTEUR AVEC AJUSTEMENT DU RATIO FORMAT -->
    <template x-if="showPreviewModal && previewMediaItem">
        <div class="modal-overlay">
            <div class="modal-box" style="max-width: 600px;">
                <div class="flex-between" style="margin-bottom: 12px;">
                    <div>
                        <h3 style="font-size: 15px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;" x-text="previewMediaItem.name"></h3>
                        <span style="font-size: 11px; color: #60a5fa; text-transform: uppercase;" x-text="'Format cible : ' + previewMediaItem.format.replace('_', ' ')"></span>
                    </div>
                    <button @click="closePreview()" style="padding: 4px 8px;">✕</button>
                </div>

                <!-- Conteneur avec adaptation dynamique du ratio d'affichage -->
                <div class="preview-container" 
                     :class="{
                         'format-youtube': ['youtube', 'facebook'].includes(previewMediaItem.format),
                         'format-vertical': ['youtube_shorts', 'tiktok', 'instagram'].includes(previewMediaItem.format),
                         'format-original': previewMediaItem.format === 'original'
                     }">
                    <template x-if="previewMediaItem.type === 'video'">
                        <video :src="previewMediaItem.url" controls autoplay playsinline style="width: 100%; height: 100%; object-fit: contain;"></video>
                    </template>
                    <template x-if="previewMediaItem.type === 'audio'">
                        <audio :src="previewMediaItem.url" controls autoplay style="width: 90%;"></audio>
                    </template>
                    <template x-if="previewMediaItem.type === 'image'">
                        <img :src="previewMediaItem.url" style="width: 100%; height: 100%; object-fit: contain;">
                    </template>
                </div>

                <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
                    <button @click="closePreview()">Fermer</button>
                </div>
            </div>
        </div>
    </template>

    <!-- MODALE CRÉATION PROJET -->
    <template x-if="showNewProjectModal">
        <div class="modal-overlay">
            <div class="modal-box">
                <div class="flex-between" style="margin-bottom: 16px;">
                    <h3 style="font-size: 18px; font-weight: 700; margin: 0;">Nouveau Projet</h3>
                    <button @click="showNewProjectModal = false" style="padding: 4px 8px;">✕</button>
                </div>
                <div style="margin-bottom: 14px;">
                    <label style="font-size: 12px; color: #9ca3af; font-weight: 600;">Titre du projet</label>
                    <input type="text" x-model="newProjectTitle" placeholder="Ex: Mon Film">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 12px; color: #9ca3af; font-weight: 600;">Type de projet</label>
                    <select x-model="newProjectType">
                        <option value="serie">Série entière</option>
                        <option value="mini_serie">Mini-série</option>
                        <option value="court_metrage">Court-métrage</option>
                        <option value="long_metrage">Long-métrage</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button @click="showNewProjectModal = false">Annuler</button>
                    <button class="btn-primary" @click="createProject()">Créer le projet</button>
                </div>
            </div>
        </div>
    </template>

    <script>
        function appData() {
            return {
                isLoading: true,
                currentView: 'dashboard',
                projects: JSON.parse(localStorage.getItem('vmax_projects') || '[]'),
                currentProject: null,
                currentEpisode: null,
                activeSeasonId: null,
                showNewProjectModal: false,
                newProjectTitle: '',
                newProjectType: 'serie',
                copiedScript: false,
                copiedPrompts: false,
                showPreviewModal: false,
                previewMediaItem: null,
                touchStartX: 0,
                touchStartY: 0,

                initApp() {
                    setTimeout(() => { this.isLoading = false; }, 500);

                    window.addEventListener('touchstart', (e) => {
                        this.touchStartX = e.touches[0].clientX;
                        this.touchStartY = e.touches[0].clientY;
                    }, { passive: true });

                    window.addEventListener('touchend', (e) => {
                        const touchEndX = e.changedTouches[0].clientX;
                        const touchEndY = e.changedTouches[0].clientY;
                        const diffX = touchEndX - this.touchStartX;
                        const diffY = Math.abs(touchEndY - this.touchStartY);

                        if (this.touchStartX < 50 && diffX > 80 && diffY < 60) {
                            this.goBack();
                        }
                    }, { passive: true });
                },

                goBack() {
                    if (this.currentView === 'episodeDetail') {
                        this.currentView = 'projectDetail';
                    } else if (this.currentView === 'projectDetail') {
                        this.currentView = 'dashboard';
                    }
                },

                saveData() {
                    localStorage.setItem('vmax_projects', JSON.stringify(this.projects));
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.projects));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", "vmax_backup_" + Date.now() + ".json");
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                },

                importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importedProjects = JSON.parse(e.target.result);
                            if (Array.isArray(importedProjects)) {
                                this.projects = importedProjects;
                                this.saveData();
                                alert('Données importées avec succès !');
                            } else {
                                alert('Format invalide.');
                            }
                        } catch (err) {
                            alert('Erreur de lecture.');
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                },

                formatType(type) {
                    const maps = { 'serie': 'Série', 'mini_serie': 'Mini-série', 'court_metrage': 'Court-métrage', 'long_metrage': 'Long-métrage' };
                    return maps[type] || type;
                },

                createProject() {
                    if (!this.newProjectTitle.trim()) return;
                    const newProj = {
                        id: Date.now().toString(),
                        title: this.newProjectTitle.trim(),
                        type: this.newProjectType,
                        seasons: []
                    };
                    const isFilm = ['court_metrage', 'long_metrage'].includes(this.newProjectType);
                    newProj.seasons.push({
                        id: 's_' + Date.now(),
                        seasonNumber: 1,
                        episodes: [{
                            id: 'e_' + Date.now(),
                            episodeNumber: 1,
                            title: isFilm ? newProj.title : 'Épisode 1',
                            script: '', prompts: '', mediaAssets: []
                        }]
                    });
                    this.projects.push(newProj);
                    this.saveData();
                    this.newProjectTitle = '';
                    this.showNewProjectModal = false;
                },

                deleteProject(id) {
                    if (confirm('Voulez-vous vraiment supprimer ce projet ?')) {
                        this.projects = this.projects.filter(p => p.id !== id);
                        this.saveData();
                    }
                },

                renameProject(project) {
                    const newTitle = prompt("Nouveau nom du projet :", project.title);
                    if (newTitle && newTitle.trim()) {
                        project.title = newTitle.trim();
                        this.saveData();
                    }
                },

                renameEpisode(episode) {
                    const newTitle = prompt("Nouveau nom de l'épisode :", episode.title);
                    if (newTitle && newTitle.trim()) {
                        episode.title = newTitle.trim();
                        this.saveData();
                    }
                },

                deleteSeason(projectId, seasonId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project && project.seasons.length > 1 && confirm("Supprimer cette saison ?")) {
                        project.seasons = project.seasons.filter(s => s.id !== seasonId);
                        this.activeSeasonId = project.seasons[0].id;
                        this.saveData();
                    }
                },

                deleteEpisode(projectId, seasonId, episodeId) {
                    const project = this.projects.find(p => p.id === projectId);
                    const season = project?.seasons.find(s => s.id === seasonId);
                    if (season && season.episodes.length > 1 && confirm("Supprimer cet épisode ?")) {
                        season.episodes = season.episodes.filter(e => e.id !== episodeId);
                        this.saveData();
                    }
                },

                openProject(project) {
                    this.currentProject = project;
                    if (project.seasons?.[0]) this.activeSeasonId = project.seasons[0].id;
                    this.currentView = 'projectDetail';
                },

                getActiveSeason() {
                    return this.currentProject?.seasons.find(s => s.id === this.activeSeasonId) || this.currentProject?.seasons[0];
                },

                openMovieWorkspace(project) {
                    if (project.seasons[0]?.episodes[0]) {
                        this.currentEpisode = project.seasons[0].episodes[0];
                        this.currentView = 'episodeDetail';
                    }
                },

                addSeason(projectId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        const newSeasonId = 's_' + Date.now();
                        project.seasons.push({
                            id: newSeasonId,
                            seasonNumber: project.seasons.length + 1,
                            episodes: [{ id: 'e_' + Date.now(), episodeNumber: 1, title: 'Épisode 1', script: '', prompts: '', mediaAssets: [] }]
                        });
                        this.activeSeasonId = newSeasonId;
                        this.saveData();
                    }
                },

                addEpisode(projectId, seasonId) {
                    const project = this.projects.find(p => p.id === projectId);
                    const season = project?.seasons.find(s => s.id === seasonId);
                    if (season) {
                        const nextNum = season.episodes.length + 1;
                        season.episodes.push({ id: 'e_' + Date.now(), episodeNumber: nextNum, title: 'Épisode ' + nextNum, script: '', prompts: '', mediaAssets: [] });
                        this.saveData();
                    }
                },

                openEpisode(episode) {
                    this.currentEpisode = episode;
                    this.currentView = 'episodeDetail';
                },

                copyText(text, type) {
                    navigator.clipboard.writeText(text || '');
                    if (type === 'script') {
                        this.copiedScript = true;
                        setTimeout(() => this.copiedScript = false, 2000);
                    } else {
                        this.copiedPrompts = true;
                        setTimeout(() => this.copiedPrompts = false, 2000);
                    }
                },

                addMedia(event, format) {
                    const file = event.target.files[0];
                    if (!file) return;
                    let type = 'video';
                    if (file.type.includes('audio')) type = 'audio';
                    else if (file.type.includes('image')) type = 'image';

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.currentEpisode.mediaAssets.push({
                            id: 'm_' + Date.now(),
                            name: file.name,
                            type: type,
                            format: format,
                            url: e.target.result
                        });
                        this.saveData();
                    };
                    reader.readAsDataURL(file);
                    event.target.value = '';
                },

                deleteMedia(mediaId) {
                    this.currentEpisode.mediaAssets = this.currentEpisode.mediaAssets.filter(m => m.id !== mediaId);
                    this.saveData();
                },

                previewMedia(media) {
                    this.previewMediaItem = media;
                    this.showPreviewModal = true;
                },

                closePreview() {
                    this.showPreviewModal = false;
                    this.previewMediaItem = null;
                },

                mediaIcon(type) {
                    if (type === 'video') return '🎥';
                    if (type === 'audio') return '🎵';
                    return '🖼️';
                }
            }
        }
    </script>
</body>
</html>
