<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMax - Gestionnaire de Projets Vidéo</title>
    
    <!-- Icône personnalisée -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%232563eb%22/><text y=%2270%22 x=%2222%22 font-size=%2255%22>🎬</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white" x-data="appData()" x-init="initApp()">

    <!-- SPLASH SCREEN PROPRE QUI DISPARAÎT -->
    <div x-show="isLoading" 
         x-transition:leave="transition ease-out duration-500"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0 pointer-events-none"
         class="fixed inset-0 z-50 bg-gray-950 flex flex-col items-center justify-center space-y-4">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-xl shadow-blue-600/30 text-3xl animate-pulse">
            🎬
        </div>
        <div class="text-center">
            <h2 class="text-xl font-extrabold tracking-wider text-white uppercase">VMax Studio</h2>
            <p class="text-xs text-gray-400 mt-1">Chargement de l'espace...</p>
        </div>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="bg-gray-900/80 backdrop-blur-md border-b border-gray-800/80 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2.5 cursor-pointer" @click="currentView = 'dashboard'">
                <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-600/30">🎬</div>
                <span class="text-lg font-bold bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">VMax</span>
            </div>
            <div class="flex items-center space-x-2">
                <button @click="window.location.reload()" class="text-xs font-medium bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-xl transition flex items-center space-x-1.5 border border-gray-700/50">
                    <span>🔄</span>
                    <span class="hidden sm:inline">Actualiser</span>
                </button>
                <button x-show="currentView !== 'dashboard'" @click="currentView = 'dashboard'" class="text-xs font-medium bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-2 rounded-xl transition border border-gray-700/50">
                    Accueil
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- 1. TABLEAU DE BORD -->
        <template x-if="currentView === 'dashboard'">
            <div class="space-y-6">
                <div>
                    <h2 class="text-2xl font-bold tracking-tight text-white">Mes Projets Vidéo</h2>
                    <p class="text-sm text-gray-400 mt-0.5">Gérez vos séries, mini-séries, courts et longs métrages.</p>
                </div>

                <!-- GRILLE DES PROJETS -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Carte Nouveau Projet -->
                    <div @click="showNewProjectModal = true" class="group bg-gradient-to-br from-blue-950/20 via-gray-900 to-gray-900 border border-blue-500/30 hover:border-blue-500/60 p-5 rounded-2xl cursor-pointer transition-all duration-200 shadow-lg flex flex-col items-center justify-center text-center space-y-2 min-h-[150px]">
                        <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl shadow-md shadow-blue-600/30 group-hover:scale-105 transition-transform">
                            +
                        </div>
                        <div>
                            <span class="font-bold text-sm text-white group-hover:text-blue-400 transition-colors">Nouveau Projet</span>
                            <p class="text-xs text-gray-400 mt-0.5">Créer une série ou un film</p>
                        </div>
                    </div>

                    <!-- Liste des projets -->
                    <template x-for="project in projects" :key="project.id">
                        <div @click="openProject(project)" class="bg-gray-900 border border-gray-800 hover:border-gray-700 p-5 rounded-2xl cursor-pointer transition-all duration-200 shadow-sm flex flex-col justify-between min-h-[150px]">
                            <div class="flex justify-between items-start gap-2">
                                <span class="text-[11px] uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full border border-gray-800"
                                    :class="{
                                        'bg-purple-950/60 text-purple-300 border-purple-900/50': project.type === 'serie',
                                        'bg-blue-950/60 text-blue-300 border-blue-900/50': project.type === 'mini_serie',
                                        'bg-green-950/60 text-green-300 border-green-900/50': project.type === 'court_metrage',
                                        'bg-amber-950/60 text-amber-300 border-amber-900/50': project.type === 'long_metrage'
                                    }"
                                    x-text="formatType(project.type)">
                                </span>
                                <button @click.stop="deleteProject(project.id)" class="text-gray-500 hover:text-red-400 p-1.5 rounded-lg hover:bg-gray-800 transition">🗑️</button>
                            </div>
                            <div class="my-3">
                                <h3 class="text-base font-bold text-white truncate" x-text="project.title"></h3>
                            </div>
                            <div class="pt-3 border-t border-gray-800/80 text-xs text-gray-400 flex justify-between items-center">
                                <span class="group-hover:text-white transition">Ouvrir l'espace</span>
                                <span class="text-blue-400 font-bold">→</span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- SYNCHRONISATION -->
                <div class="bg-gray-900 border border-gray-800 p-5 sm:p-6 rounded-2xl shadow-lg space-y-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-purple-950/80 text-purple-400 border border-purple-900/50 flex items-center justify-center text-lg flex-shrink-0">
                            🔄
                        </div>
                        <div>
                            <h3 class="font-bold text-sm text-white">Synchronisation & Sauvegarde</h3>
                            <p class="text-xs text-gray-400">Exportez ou importez vos fichiers de sauvegarde JSON.</p>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 pt-1">
                        <button @click="exportData()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2.5 rounded-xl transition text-xs font-semibold flex items-center justify-center space-x-2 border border-gray-700/50">
                            <span class="text-emerald-400">⬇️</span>
                            <span>Exporter les données (JSON)</span>
                        </button>
                        <label class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-2.5 rounded-xl transition cursor-pointer text-xs font-semibold flex items-center justify-center space-x-2 border border-gray-700/50">
                            <span class="text-amber-400">⬆️</span>
                            <span>Importer une sauvegarde</span>
                            <input type="file" accept=".json" class="hidden" @change="importData($event)">
                        </label>
                    </div>
                </div>
            </div>
        </template>

        <!-- 2. VUE DÉTAILLÉE DU PROJET -->
        <template x-if="currentView === 'projectDetail' && currentProject">
            <div class="space-y-6">
                <!-- Fil d'Ariane -->
                <div class="bg-gray-900 border border-gray-800 px-4 py-2.5 rounded-xl flex items-center space-x-2 text-xs text-gray-400 overflow-x-auto">
                    <span class="cursor-pointer hover:text-white whitespace-nowrap" @click="currentView = 'dashboard'">Accueil</span>
                    <span class="text-gray-600">/</span>
                    <span class="text-white font-medium whitespace-nowrap truncate max-w-[200px]" x-text="currentProject.title"></span>
                </div>

                <!-- En-tête -->
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between gap-4 shadow-lg">
                    <div class="overflow-hidden">
                        <h2 class="text-xl font-bold truncate text-white" x-text="currentProject.title"></h2>
                        <p class="text-xs text-gray-400 capitalize mt-0.5" x-text="'Type : ' + formatType(currentProject.type)"></p>
                    </div>
                    <button @click="renameProject(currentProject)" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl transition border border-gray-700/50 whitespace-nowrap">
                        Renommer
                    </button>
                </div>

                <template x-if="currentProject.type === 'serie' || currentProject.type === 'mini_serie'">
                    <div class="space-y-4">
                        <!-- Sélecteur de Saisons -->
                        <div class="flex items-center space-x-2 overflow-x-auto pb-1">
                            <template x-for="season in currentProject.seasons" :key="season.id">
                                <button @click="activeSeasonId = season.id" 
                                        class="px-4 py-2 rounded-xl text-xs font-semibold transition flex-shrink-0 border"
                                        :class="activeSeasonId === season.id ? 'bg-blue-600 text-white border-blue-500 shadow-md shadow-blue-600/20' : 'bg-gray-900 text-gray-400 border-gray-800 hover:text-white'"
                                        x-text="'Saison ' + season.seasonNumber">
                                </button>
                            </template>
                            <button @click="addSeason(currentProject.id)" class="px-3.5 py-2 rounded-xl text-xs font-medium bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700/50 flex-shrink-0">
                                + Saison
                            </button>
                        </div>

                        <!-- Contenu Saison -->
                        <template x-if="getActiveSeason()">
                            <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-4 shadow-md">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-sm text-blue-400" x-text="'Saison ' + getActiveSeason().seasonNumber"></h4>
                                    <div class="flex items-center space-x-2">
                                        <button @click="deleteSeason(currentProject.id, getActiveSeason().id)" class="text-xs text-red-400 bg-red-950/60 border border-red-900/50 px-2.5 py-1.5 rounded-lg">Supprimer</button>
                                        <button @click="addEpisode(currentProject.id, getActiveSeason().id)" class="text-xs bg-blue-950/60 text-blue-300 border border-blue-900/50 px-3 py-1.5 rounded-lg">+ Épisode</button>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    <template x-for="episode in getActiveSeason().episodes" :key="episode.id">
                                        <div class="bg-gray-950 border border-gray-800 hover:border-gray-700 p-3.5 rounded-xl transition flex justify-between items-center">
                                            <div @click="openEpisode(episode)" class="overflow-hidden pr-2 flex-1 cursor-pointer">
                                                <span class="text-[10px] text-gray-500 block" x-text="'Épisode ' + episode.episodeNumber"></span>
                                                <span class="font-semibold text-white text-xs block truncate" x-text="episode.title"></span>
                                            </div>
                                            <div class="flex items-center space-x-2 flex-shrink-0">
                                                <button @click="deleteEpisode(currentProject.id, getActiveSeason().id, episode.id)" class="text-gray-500 hover:text-red-400 text-xs p-1">🗑️</button>
                                                <span @click="openEpisode(episode)" class="text-gray-600 cursor-pointer text-xs">➔</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template x-if="currentProject.type === 'court_metrage' || currentProject.type === 'long_metrage'">
                    <div>
                        <div x-init="openMovieWorkspace(currentProject)"></div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 3. ESPACE DE TRAVAIL DE L'ÉPISODE -->
        <template x-if="currentView === 'episodeDetail' && currentEpisode">
            <div class="space-y-6">
                <!-- Fil d'Ariane -->
                <div class="bg-gray-900 border border-gray-800 px-4 py-2.5 rounded-xl flex items-center space-x-2 text-xs text-gray-400 overflow-x-auto">
                    <span class="cursor-pointer hover:text-white whitespace-nowrap" @click="currentView = 'dashboard'">Accueil</span>
                    <span class="text-gray-600">/</span>
                    <span class="cursor-pointer hover:text-white whitespace-nowrap truncate max-w-[100px]" @click="currentView = 'projectDetail'" x-text="currentProject.title"></span>
                    <span class="text-gray-600">/</span>
                    <span class="text-white font-medium whitespace-nowrap truncate max-w-[100px]" x-text="currentEpisode.title"></span>
                </div>

                <!-- En-tête -->
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between gap-4 shadow-lg">
                    <div class="overflow-hidden">
                        <h2 class="text-xl font-bold truncate text-white" x-text="currentEpisode.title"></h2>
                        <p class="text-xs text-gray-400 mt-0.5">Espace de travail : Script, Prompt et Rushes.</p>
                    </div>
                    <button @click="renameEpisode(currentEpisode)" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-3.5 py-2 rounded-xl transition border border-gray-700/50 whitespace-nowrap">
                        Renommer
                    </button>
                </div>

                <!-- SCRIPT & PROMPT -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-3 shadow-md">
                        <div class="flex justify-between items-center">
                            <label class="font-bold text-xs text-gray-300 uppercase tracking-wider">Script</label>
                            <button @click="copyText(currentEpisode.script, 'script')" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition" x-text="copiedScript ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.script" @input="saveData()" rows="10" placeholder="Rédigez ou collez votre script ici..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500 text-white leading-relaxed"></textarea>
                    </div>

                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-3 shadow-md">
                        <div class="flex justify-between items-center">
                            <label class="font-bold text-xs text-gray-300 uppercase tracking-wider">Prompt</label>
                            <button @click="copyText(currentEpisode.prompts, 'prompts')" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition" x-text="copiedPrompts ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.prompts" @input="saveData()" rows="10" placeholder="Collez vos prompts ici..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs focus:outline-none focus:border-blue-500 text-white leading-relaxed"></textarea>
                    </div>
                </div>

                <!-- MÉDIAS ORIGINAUX -->
                <div class="bg-gray-900 border border-gray-800 p-5 sm:p-6 rounded-2xl space-y-4 shadow-lg">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-sm text-white">📁 Fichiers Originaux</h3>
                        <label class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 py-2 rounded-xl cursor-pointer transition shadow-md shadow-blue-600/20">
                            + Ajouter
                            <input type="file" class="hidden" @change="addMedia($event, 'original')">
                        </label>
                    </div>

                    <div class="space-y-2.5">
                        <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'original')" :key="media.id">
                            <div class="bg-gray-950 border border-gray-800 p-3.5 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
                                <div class="flex items-center space-x-2.5 overflow-hidden w-full sm:w-auto">
                                    <span class="text-base flex-shrink-0" x-text="mediaIcon(media.type)"></span>
                                    <span class="font-medium text-white truncate max-w-[200px]" x-text="media.name"></span>
                                </div>
                                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                    <button @click="previewMedia(media)" class="text-blue-300 bg-blue-950/80 border border-blue-900/50 px-3 py-1.5 rounded-lg font-medium">Lire ▶️</button>
                                    <a :href="media.url" :download="media.name" class="text-gray-300 bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg">Télécharger</a>
                                    <button @click="deleteMedia(media.id)" class="text-red-400 bg-red-950/60 border border-red-900/50 px-2.5 py-1.5 rounded-lg">✕</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="currentEpisode.mediaAssets.filter(m => m.format === 'original').length === 0">
                            <p class="text-gray-500 text-xs py-1">Aucun fichier original.</p>
                        </template>
                    </div>
                </div>

                <!-- FORMATS RÉSEAUX SOCIAUX -->
                <div class="bg-gray-900 border border-gray-800 p-5 sm:p-6 rounded-2xl space-y-4 shadow-lg">
                    <h3 class="font-bold text-sm text-white">📱 Formats Réseaux Sociaux</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <template x-for="fmt in ['youtube', 'youtube_shorts', 'tiktok', 'instagram', 'facebook']">
                            <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl space-y-3">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-xs text-blue-400 capitalize" x-text="fmt.replace('_', ' ')"></span>
                                    <label class="text-[11px] bg-gray-800 hover:bg-gray-700 text-gray-200 px-2.5 py-1 rounded-lg cursor-pointer">
                                        + Ajouter
                                        <input type="file" class="hidden" @change="addMedia($event, fmt)">
                                    </label>
                                </div>
                                <div class="space-y-2">
                                    <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === fmt)" :key="media.id">
                                        <div class="bg-gray-900 p-2.5 rounded-xl flex flex-col space-y-2 text-[11px] border border-gray-800">
                                            <div class="flex justify-between items-center">
                                                <span class="font-medium text-white truncate max-w-[150px]" x-text="media.name"></span>
                                                <button @click="deleteMedia(media.id)" class="text-red-400">✕</button>
                                            </div>
                                            <div class="flex space-x-2 pt-1 border-t border-gray-800">
                                                <button @click="previewMedia(media)" class="flex-1 text-blue-300 bg-blue-950/80 py-1.5 rounded-lg text-center font-semibold">Lire ▶️</button>
                                                <a :href="media.url" :download="media.name" class="flex-1 text-gray-300 bg-gray-800 py-1.5 rounded-lg text-center">Sauver</a>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- MODALE LECTEUR -->
    <template x-if="showPreviewModal && previewMediaItem">
        <div class="fixed inset-0 bg-gray-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center px-5 py-4 bg-gray-950 border-b border-gray-800">
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <span class="text-xl" x-text="mediaIcon(previewMediaItem.type)"></span>
                        <h3 class="font-bold text-sm text-white truncate" x-text="previewMediaItem.name"></h3>
                    </div>
                    <button @click="closePreview()" class="w-8 h-8 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-full flex items-center justify-center text-xs">✕</button>
                </div>
                <div class="flex-1 flex items-center justify-center bg-gray-950 p-4 max-h-[60vh] overflow-hidden">
                    <template x-if="previewMediaItem.type === 'video'">
                        <video :src="previewMediaItem.url" controls autoplay playsinline class="max-h-[55vh] rounded-xl border border-gray-800"></video>
                    </template>
                    <template x-if="previewMediaItem.type === 'audio'">
                        <audio :src="previewMediaItem.url" controls autoplay class="w-full"></audio>
                    </template>
                    <template x-if="previewMediaItem.type === 'image'">
                        <img :src="previewMediaItem.url" class="max-w-full max-h-[55vh] object-contain rounded-xl border border-gray-800">
                    </template>
                </div>
                <div class="flex justify-end px-5 py-4 bg-gray-950 border-t border-gray-800">
                    <button @click="closePreview()" class="px-4 py-2 text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl">Fermer</button>
                </div>
            </div>
        </div>
    </template>

    <!-- MODALE CRÉATION PROJET -->
    <template x-if="showNewProjectModal">
        <div class="fixed inset-0 bg-gray-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-gray-900 border border-gray-800 p-6 rounded-3xl w-full max-w-md space-y-4 shadow-2xl">
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-white">Nouveau Projet</h3>
                    <button @click="showNewProjectModal = false" class="text-gray-400 hover:text-white">✕</button>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-gray-400">Titre du projet</label>
                    <input type="text" x-model="newProjectTitle" placeholder="Ex: Mon Film" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-gray-400">Type de projet</label>
                    <select x-model="newProjectType" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-blue-500">
                        <option value="serie">Série entière</option>
                        <option value="mini_serie">Mini-série</option>
                        <option value="court_metrage">Court-métrage</option>
                        <option value="long_metrage">Long-métrage</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-2.5 pt-2">
                    <button @click="showNewProjectModal = false" class="px-4 py-2 text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl">Annuler</button>
                    <button @click="createProject()" class="px-5 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white rounded-xl shadow-md">Créer</button>
                </div>
            </div>
        </div>
    </template>

    <!-- JAVASCRIPT -->
    <script>
        function appData() {
            return {
                isLoading: true,
                currentView: 'dashboard',
                projects: JSON.parse(localStorage.getItem('vmax_projects') || '[]'),
                currentProject: null,
                currentEpisode: null,
                activeSeasonId: null,
                showNewProjectModal: false,
                newProjectTitle: '',
                newProjectType: 'serie',
                copiedScript: false,
                copiedPrompts: false,
                showPreviewModal: false,
                previewMediaItem: null,
                touchStartX: 0,
                touchStartY: 0,

                initApp() {
                    setTimeout(() => { this.isLoading = false; }, 800);

                    window.addEventListener('touchstart', (e) => {
                        this.touchStartX = e.touches[0].clientX;
                        this.touchStartY = e.touches[0].clientY;
                    }, { passive: true });

                    window.addEventListener('touchend', (e) => {
                        const touchEndX = e.changedTouches[0].clientX;
                        const touchEndY = e.changedTouches[0].clientY;
                        const diffX = touchEndX - this.touchStartX;
                        const diffY = Math.abs(touchEndY - this.touchStartY);

                        if (this.touchStartX < 50 && diffX > 80 && diffY < 60) {
                            this.goBack();
                        }
                    }, { passive: true });
                },

                goBack() {
                    if (this.currentView === 'episodeDetail') {
                        this.currentView = 'projectDetail';
                    } else if (this.currentView === 'projectDetail') {
                        this.currentView = 'dashboard';
                    }
                },

                saveData() {
                    localStorage.setItem('vmax_projects', JSON.stringify(this.projects));
                },

                exportData() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.projects));
                    const downloadAnchor = document.createElement('a');
                    downloadAnchor.setAttribute("href", dataStr);
                    downloadAnchor.setAttribute("download", "vmax_backup_" + Date.now() + ".json");
                    document.body.appendChild(downloadAnchor);
                    downloadAnchor.click();
                    downloadAnchor.remove();
                },

                importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const importedProjects = JSON.parse(e.target.result);
                            if (Array.isArray(importedProjects)) {
                                this.projects = importedProjects;
                                this.saveData();
                                alert('Données importées avec succès !');
                            } else {
                                alert('Format invalide.');
                            }
                        } catch (err) {
                            alert('Erreur de lecture.');
                        }
                    };
                    reader.readAsText(file);
                    event.target.value = '';
                },

                formatType(type) {
                    const maps = { 'serie': 'Série', 'mini_serie': 'Mini-série', 'court_metrage': 'Court-métrage', 'long_metrage': 'Long-métrage' };
                    return maps[type] || type;
                },

                createProject() {
                    if (!this.newProjectTitle.trim()) return;
                    const newProj = {
                        id: Date.now().toString(),
                        title: this.newProjectTitle,
                        type: this.newProjectType,
                        seasons: []
                    };
                    const isFilm = ['court_metrage', 'long_metrage'].includes(this.newProjectType);
                    newProj.seasons.push({
                        id: 's_' + Date.now(),
                        seasonNumber: 1,
                        episodes: [{
                            id: 'e_' + Date.now(),
                            episodeNumber: 1,
                            title: isFilm ? this.newProjectTitle : 'Épisode 1',
                            script: '', prompts: '', mediaAssets: []
                        }]
                    });
                    this.projects.push(newProj);
                    this.saveData();
                    this.newProjectTitle = '';
                    this.showNewProjectModal = false;
                },

                deleteProject(id) {
                    if (confirm('Supprimer ce projet ?')) {
                        this.projects = this.projects.filter(p => p.id !== id);
                        this.saveData();
                    }
                },

                renameProject(project) {
                    const newTitle = prompt("Nouveau nom :", project.title);
                    if (newTitle && newTitle.trim()) {
                        project.title = newTitle.trim();
                        this.saveData();
                    }
                },

                renameEpisode(episode) {
                    const newTitle = prompt("Nouveau nom :", episode.title);
                    if (newTitle && newTitle.trim()) {
                        episode.title = newTitle.trim();
                        this.saveData();
                    }
                },

                deleteSeason(projectId, seasonId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project && project.seasons.length > 1 && confirm("Supprimer cette saison ?")) {
                        project.seasons = project.seasons.filter(s => s.id !== seasonId);
                        this.activeSeasonId = project.seasons[0].id;
                        this.saveData();
                    }
                },

                deleteEpisode(projectId, seasonId, episodeId) {
                    const project = this.projects.find(p => p.id === projectId);
                    const season = project?.seasons.find(s => s.id === seasonId);
                    if (season && season.episodes.length > 1 && confirm("Supprimer cet épisode ?")) {
                        season.episodes = season.episodes.filter(e => e.id !== episodeId);
                        this.saveData();
                    }
                },

                openProject(project) {
                    this.currentProject = project;
                    if (project.seasons?.[0]) this.activeSeasonId = project.seasons[0].id;
                    this.currentView = 'projectDetail';
                },

                getActiveSeason() {
                    return this.currentProject?.seasons.find(s => s.id === this.activeSeasonId) || this.currentProject?.seasons[0];
                },

                openMovieWorkspace(project) {
                    if (project.seasons[0]?.episodes[0]) {
                        this.currentEpisode = project.seasons[0].episodes[0];
                        this.currentView = 'episodeDetail';
                    }
                },

                addSeason(projectId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        const newSeasonId = 's_' + Date.now();
                        project.seasons.push({
                            id: newSeasonId,
                            seasonNumber: project.seasons.length + 1,
                            episodes: [{ id: 'e_' + Date.now(), episodeNumber: 1, title: 'Épisode 1', script: '', prompts: '', mediaAssets: [] }]
                        });
                        this.activeSeasonId = newSeasonId;
                        this.saveData();
                    }
                },

                addEpisode(projectId, seasonId) {
                    const project = this.projects.find(p => p.id === projectId);
                    const season = project?.seasons.find(s => s.id === seasonId);
                    if (season) {
                        const nextNum = season.episodes.length + 1;
                        season.episodes.push({ id: 'e_' + Date.now(), episodeNumber: nextNum, title: 'Épisode ' + nextNum, script: '', prompts: '', mediaAssets: [] });
                        this.saveData();
                    }
                },

                openEpisode(episode) {
                    this.currentEpisode = episode;
                    this.currentView = 'episodeDetail';
                },

                copyText(text, type) {
                    navigator.clipboard.writeText(text || '');
                    if (type === 'script') {
                        this.copiedScript = true;
                        setTimeout(() => this.copiedScript = false, 2000);
                    } else {
                        this.copiedPrompts = true;
                        setTimeout(() => this.copiedPrompts = false, 2000);
                    }
                },

                addMedia(event, format) {
                    const file = event.target.files[0];
                    if (!file) return;
                    let type = 'video';
                    if (file.type.includes('audio')) type = 'audio';
                    else if (file.type.includes('image')) type = 'image';

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.currentEpisode.mediaAssets.push({
                            id: 'm_' + Date.now(),
                            name: file.name,
                            type: type,
                            format: format,
                            url: e.target.result
                        });
                        this.saveData();
                    };
                    reader.readAsDataURL(file);
                    event.target.value = '';
                },

                deleteMedia(mediaId) {
                    this.currentEpisode.mediaAssets = this.currentEpisode.mediaAssets.filter(m => m.id !== mediaId);
                    this.saveData();
                },

                previewMedia(media) {
                    this.previewMediaItem = media;
                    this.showPreviewModal = true;
                },

                closePreview() {
                    this.showPreviewModal = false;
                    this.previewMediaItem = null;
                },

                mediaIcon(type) {
                    if (type === 'video') return '🎥';
                    if (type === 'audio') return '🎵';
                    return '🖼️';
                }
            }
        }
    </script>
</body>
</html>
