<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMax - Gestionnaire de Projets Vidéo</title>
    
    <!-- Icône personnalisée pour l'écran d'accueil iOS -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2225%22 fill=%22%232563eb%22/><text y=%2270%22 x=%2222%22 font-size=%2255%22>🎬</text></svg>">
    
    <!-- Tailwind CSS (chargé en priorité pour garantir le design) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js pour la réactivité -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans overflow-x-hidden" x-data="appData()" x-init="initApp()">

    <!-- ANIMATION D'ALLUMAGE (SPLASH SCREEN CINÉMATIQUE) -->
    <div x-show="isLoading" 
         x-transition:leave="transition ease-out duration-700"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-105"
         class="fixed inset-0 z-50 bg-gradient-to-b from-gray-950 via-gray-900 to-black flex flex-col items-center justify-center space-y-6">
        <div class="relative flex items-center justify-center">
            <div class="absolute w-36 h-36 bg-blue-600/30 rounded-full animate-ping"></div>
            <div class="absolute w-28 h-28 bg-purple-600/20 rounded-full animate-pulse"></div>
            <div class="relative w-24 h-24 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-3xl flex items-center justify-center shadow-2xl shadow-blue-500/50 transform hover:scale-105 transition">
                <span class="text-4xl animate-bounce">🎬</span>
            </div>
        </div>
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-extrabold tracking-widest uppercase bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-500 bg-clip-text text-transparent">
                VMax Studio
            </h2>
            <p class="text-xs text-gray-400 tracking-widest uppercase">Moteur, ça tourne...</p>
        </div>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header class="bg-gray-900/90 backdrop-blur-md border-b border-gray-800/80 p-4 sticky top-0 z-40 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent cursor-pointer flex items-center space-x-2" @click="currentView = 'dashboard'">
                <span>🎬</span><span>VMax</span>
            </h1>
            <div class="flex items-center space-x-2">
                <!-- Bouton Actualiser -->
                <button @click="window.location.reload()" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-2 rounded-xl transition shadow-sm flex items-center space-x-1.5" title="Actualiser l'application">
                    <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Actualiser</span>
                </button>
                <button x-show="currentView !== 'dashboard'" @click="currentView = 'dashboard'" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-2 rounded-xl transition shadow-sm">
                    Accueil
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl mx-auto p-4 md:p-6 pt-6 md:pt-8 space-y-6">

        <!-- 1. TABLEAU DE BORD (DASHBOARD) -->
        <template x-if="currentView === 'dashboard'">
            <div class="space-y-6">
                <div>
                    <h2 class="text-2xl font-bold">Mes Projets Vidéo</h2>
                    <p class="text-sm text-gray-400">Gérez vos séries, mini-séries, courts et longs métrages.</p>
                </div>

                <!-- Grille des Projets + Carte "Nouveau Projet" -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div @click="showNewProjectModal = true" class="bg-gradient-to-br from-blue-950/40 via-gray-900 to-purple-950/40 border border-blue-500/40 hover:border-blue-500/80 p-6 rounded-2xl cursor-pointer transition-all duration-300 shadow-xl flex flex-col items-center justify-center text-center space-y-3 min-h-[160px] group">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 text-white flex items-center justify-center text-2xl shadow-lg shadow-blue-500/30 group-hover:scale-110 transition-transform duration-300">
                            +
                        </div>
                        <div>
                            <span class="font-bold text-base text-white group-hover:text-blue-400 transition-colors">Nouveau Projet</span>
                            <p class="text-xs text-gray-400 mt-0.5">Créer une série, mini-série ou film</p>
                        </div>
                    </div>

                    <template x-for="project in projects" :key="project.id">
                        <div @click="openProject(project)" class="bg-gray-900 border border-gray-800 hover:border-blue-500/50 p-5 rounded-2xl cursor-pointer transition shadow-sm hover:shadow-md flex flex-col justify-between min-h-[160px]">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-xs uppercase tracking-wider font-semibold px-2.5 py-1 rounded-full"
                                        :class="{
                                            'bg-purple-900/50 text-purple-300 border border-purple-700/50': project.type === 'serie',
                                            'bg-blue-900/50 text-blue-300 border border-blue-700/50': project.type === 'mini_serie',
                                            'bg-green-900/50 text-green-300 border border-green-700/50': project.type === 'court_metrage',
                                            'bg-amber-900/50 text-amber-300 border border-amber-700/50': project.type === 'long_metrage'
                                        }"
                                        x-text="formatType(project.type)">
                                    </span>
                                    <button @click.stop="deleteProject(project.id)" class="text-gray-500 hover:text-red-400 text-sm p-1">🗑️</button>
                                </div>
                                <h3 class="text-lg font-bold text-white mb-1 truncate" x-text="project.title"></h3>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-800 text-xs text-gray-400 flex justify-between items-center">
                                <span>Ouvrir l'espace</span>
                                <span>➔</span>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- SECTION BASSE : SYNCHRONISATION & SAUVEGARDE (.ZIP) -->
                <div class="mt-8 bg-gray-900 border border-gray-800 p-6 rounded-3xl shadow-xl space-y-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-lg flex-shrink-0">
                            🔄
                        </div>
                        <div>
                            <h3 class="font-bold text-base text-white">Synchronisation & Sauvegarde (.ZIP)</h3>
                            <p class="text-xs text-gray-400">Exportez ou importez vos projets sous forme d'archive ZIP (données + médias compressés).</p>
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 pt-2">
                        <button @click="exportData()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-3 rounded-xl transition text-xs font-semibold flex items-center justify-center space-x-2 border border-gray-700/50 shadow-sm">
                            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <span>Exporter en Archive ZIP</span>
                        </button>
                        <label class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-3 rounded-xl transition cursor-pointer text-xs font-semibold flex items-center justify-center space-x-2 border border-gray-700/50 shadow-sm">
                            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            <span>Importer une sauvegarde ZIP</span>
                            <input type="file" accept=".zip,.json" class="hidden" @change="importData($event)">
                        </label>
                    </div>
                </div>

            </div>
        </template>

        <!-- 2. VUE DÉTAILLÉE DU PROJET -->
        <template x-if="currentView === 'projectDetail' && currentProject">
            <div class="space-y-6">
                <!-- Fil d'Ariane -->
                <div class="bg-gray-900 border border-gray-800 px-4 py-3 rounded-2xl flex items-center space-x-2 text-xs sm:text-sm text-gray-400 overflow-x-auto shadow-sm">
                    <span class="cursor-pointer hover:text-white whitespace-nowrap" @click="currentView = 'dashboard'">Accueil</span>
                    <span class="text-gray-600">/</span>
                    <span class="text-white font-medium whitespace-nowrap truncate max-w-[200px]" x-text="currentProject.title"></span>
                </div>

                <!-- En-tête du projet compact -->
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between gap-4 shadow-lg">
                    <div class="overflow-hidden">
                        <h2 class="text-xl sm:text-2xl font-bold truncate" x-text="currentProject.title"></h2>
                        <p class="text-xs text-gray-400 capitalize mt-0.5" x-text="'Type : ' + formatType(currentProject.type)"></p>
                    </div>
                    <button @click="openRenameModal('project', currentProject)" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-2 rounded-xl transition border border-gray-700/50 shadow-sm whitespace-nowrap flex-shrink-0">
                        Modifier le nom
                    </button>
                </div>

                <template x-if="currentProject.type === 'serie' || currentProject.type === 'mini_serie'">
                    <div class="space-y-4">
                        
                        <!-- SÉLECTEUR DE SAISONS STYLE NETFLIX -->
                        <div class="flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-none">
                            <template x-for="season in currentProject.seasons" :key="season.id">
                                <button @click="activeSeasonId = season.id" 
                                        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition flex-shrink-0"
                                        :class="activeSeasonId === season.id ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'bg-gray-900 text-gray-400 hover:text-white border border-gray-800'"
                                        x-text="'Saison ' + season.seasonNumber">
                                </button>
                            </template>
                            <button @click="addSeason(currentProject.id)" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700/50 flex-shrink-0 whitespace-nowrap">
                                + Saison
                            </button>
                        </div>

                        <!-- CONTENU DE LA SAISON ACTIVE -->
                        <template x-if="getActiveSeason()">
                            <div class="bg-gray-900 border border-gray-800 p-4 sm:p-5 rounded-2xl space-y-4 shadow-md">
                                <div class="flex justify-between items-center">
                                    <h4 class="font-bold text-base text-blue-400" x-text="'Saison ' + getActiveSeason().seasonNumber"></h4>
                                    <div class="flex items-center space-x-2">
                                        <button @click="deleteSeason(currentProject.id, getActiveSeason().id)" class="text-xs text-red-400 hover:text-red-300 bg-red-950/40 border border-red-900/40 px-2.5 py-1.5 rounded-lg transition">
                                            Supprimer
                                        </button>
                                        <button @click="addEpisode(currentProject.id, getActiveSeason().id)" class="text-xs bg-blue-600/20 text-blue-300 border border-blue-500/30 px-3 py-1.5 rounded-lg hover:bg-blue-600/30 transition">
                                            + Épisode
                                        </button>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    <template x-for="episode in getActiveSeason().episodes" :key="episode.id">
                                        <div class="bg-gray-950 border border-gray-800 hover:border-gray-700 p-3.5 rounded-xl transition flex justify-between items-center">
                                            <div @click="openEpisode(episode)" class="overflow-hidden pr-2 flex-1 cursor-pointer">
                                                <span class="text-[10px] text-gray-500 block" x-text="'Épisode ' + episode.episodeNumber"></span>
                                                <span class="font-semibold text-white text-xs sm:text-sm block truncate max-w-[140px]" x-text="episode.title"></span>
                                            </div>
                                            <div class="flex items-center space-x-1.5 flex-shrink-0">
                                                <button @click="deleteEpisode(currentProject.id, getActiveSeason().id, episode.id)" class="text-gray-500 hover:text-red-400 text-xs p-1" title="Supprimer l'épisode">🗑️</button>
                                                <span @click="openEpisode(episode)" class="text-gray-600 cursor-pointer text-xs">➔</span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                    </div>
                </template>

                <template x-if="currentProject.type === 'court_metrage' || currentProject.type === 'long_metrage'">
                    <div>
                        <div x-init="openMovieWorkspace(currentProject)"></div>
                    </div>
                </template>
            </div>
        </template>

        <!-- 3. ESPACE DE TRAVAIL DE L'ÉPISODE -->
        <template x-if="currentView === 'episodeDetail' && currentEpisode">
            <div class="space-y-6">
                <!-- Fil d'Ariane -->
                <div class="bg-gray-900 border border-gray-800 px-4 py-3 rounded-2xl flex items-center space-x-2 text-xs sm:text-sm text-gray-400 overflow-x-auto shadow-sm">
                    <span class="cursor-pointer hover:text-white whitespace-nowrap" @click="currentView = 'dashboard'">Accueil</span>
                    <span class="text-gray-600">/</span>
                    <span class="cursor-pointer hover:text-white whitespace-nowrap truncate max-w-[100px]" @click="currentView = 'projectDetail'" x-text="currentProject.title"></span>
                    <span class="text-gray-600">/</span>
                    <span class="text-white font-medium whitespace-nowrap truncate max-w-[100px]" x-text="currentEpisode.title"></span>
                </div>

                <!-- En-tête de l'épisode compact -->
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center justify-between gap-4 shadow-lg">
                    <div class="overflow-hidden">
                        <h2 class="text-xl sm:text-2xl font-bold truncate" x-text="currentEpisode.title"></h2>
                        <p class="text-xs text-gray-400 mt-0.5">Espace de travail : Script, Prompt et Rushes.</p>
                    </div>
                    <button @click="openRenameModal('episode', currentEpisode)" class="text-xs font-semibold bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-2 rounded-xl transition border border-gray-700/50 shadow-sm whitespace-nowrap flex-shrink-0">
                        Modifier le nom
                    </button>
                </div>

                <!-- SECTION A : SCRIPT & PROMPT -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-3 shadow-md">
                        <div class="flex justify-between items-center">
                            <label class="font-bold text-sm text-gray-300">Script</label>
                            <button @click="copyText(currentEpisode.script, 'script')" class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-lg transition" x-text="copiedScript ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.script" @input="saveData()" rows="10" placeholder="Rédigez ou collez votre script ici..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl space-y-3 shadow-md">
                        <div class="flex justify-between items-center">
                            <label class="font-bold text-sm text-gray-300">Prompt</label>
                            <button @click="copyText(currentEpisode.prompts, 'prompts')" class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1 rounded-lg transition" x-text="copiedPrompts ? 'Copié !' : 'Copier'"></button>
                        </div>
                        <textarea x-model="currentEpisode.prompts" @input="saveData()" rows="10" placeholder="Collez vos prompts ici..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                </div>

                <!-- SECTION B : ESPACE MÉDIAS ORIGINAUX -->
                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl space-y-4 shadow-lg">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-lg">📁 Fichiers Originaux</h3>
                        <label class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 py-2.5 rounded-xl cursor-pointer transition shadow-md shadow-blue-600/20">
                            + Ajouter un fichier
                            <input type="file" class="hidden" @change="addMedia($event, 'original')">
                        </label>
                    </div>

                    <div class="space-y-3">
                        <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'original')" :key="media.id">
                            <div class="bg-gray-950 border border-gray-800 p-3.5 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-sm">
                                <div class="flex items-center space-x-2.5 overflow-hidden w-full sm:w-auto">
                                    <span class="text-lg flex-shrink-0" x-text="mediaIcon(media.type)"></span>
                                    <span class="font-medium text-white truncate max-w-[200px] sm:max-w-xs" x-text="media.name"></span>
                                </div>
                                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end flex-wrap gap-1.5">
                                    <button @click="previewMedia(media)" class="text-blue-300 hover:text-white bg-blue-950 hover:bg-blue-900 border border-blue-800/50 px-3 py-1.5 rounded-lg text-xs font-medium transition">Lire ▶️</button>
                                    <a :href="media.url" :download="media.name" class="text-gray-300 hover:text-white bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-xs transition">Télécharger</a>
                                    <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 bg-red-950/40 hover:bg-red-900/40 border border-red-900/50 px-2.5 py-1.5 rounded-lg text-xs transition">Supprimer</button>
                                </div>
                            </div>
                        </template>
                        <template x-if="currentEpisode.mediaAssets.filter(m => m.format === 'original').length === 0">
                            <p class="text-gray-500 text-sm py-2">Aucun fichier original enregistré.</p>
                        </template>
                    </div>
                </div>

                <!-- SECTION C : FORMATS RÉSEAUX SOCIAUX -->
                <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl space-y-4 shadow-lg">
                    <h3 class="font-bold text-lg">📱 Formats Réseaux Sociaux</h3>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        
                        <!-- YouTube -->
                        <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-red-400">YouTube (16:9)</span>
                                <label class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
                                    + Ajouter
                                    <input type="file" class="hidden" @change="addMedia($event, 'youtube')">
                                </label>
                            </div>
                            <div class="space-y-2">
                                <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'youtube')" :key="media.id">
                                    <div class="bg-gray-900 p-3 rounded-xl flex flex-col space-y-2 text-xs">
                                        <div class="flex justify-between items-center">
                                            <span class="font-medium text-white truncate max-w-[170px]" x-text="media.name"></span>
                                            <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                                        </div>
                                        <div class="flex space-x-2 pt-1 border-t border-gray-800">
                                            <button @click="previewMedia(media)" class="flex-1 text-blue-300 bg-blue-950 border border-blue-800/50 py-1.5 rounded-lg text-center font-semibold">Lire ▶️</button>
                                            <a :href="media.url" :download="media.name" class="flex-1 text-gray-300 bg-gray-800 py-1.5 rounded-lg text-center font-medium">Télécharger</a>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- YouTube Shorts -->
                        <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-red-500">YouTube Shorts (9:16)</span>
                                <label class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
                                    + Ajouter
                                    <input type="file" class="hidden" @change="addMedia($event, 'youtube_shorts')">
                                </label>
                            </div>
                            <div class="space-y-2">
                                <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'youtube_shorts')" :key="media.id">
                                    <div class="bg-gray-900 p-3 rounded-xl flex flex-col space-y-2 text-xs">
                                        <div class="flex justify-between items-center">
                                            <span class="font-medium text-white truncate max-w-[170px]" x-text="media.name"></span>
                                            <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                                        </div>
                                        <div class="flex space-x-2 pt-1 border-t border-gray-800">
                                            <button @click="previewMedia(media)" class="flex-1 text-blue-300 bg-blue-950 border border-blue-800/50 py-1.5 rounded-lg text-center font-semibold">Lire ▶️</button>
                                            <a :href="media.url" :download="media.name" class="flex-1 text-gray-300 bg-gray-800 py-1.5 rounded-lg text-center font-medium">Télécharger</a>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- TikTok -->
                        <div class="bg-gray-950 border border-gray-800 p-4 rounded-xl space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-pink-400">TikTok (9:16)</span>
                                <label class="text-xs bg-gray-800 hover:bg-gray-700 px-2.5 py-1.5 rounded-lg cursor-pointer">
                                    + Ajouter
                                    <input type="file" class="hidden" @change="addMedia($event, 'tiktok')">
                                </label>
                            </div>
                            <div class="space-y-2">
                                <template x-for="media in currentEpisode.mediaAssets.filter(m => m.format === 'tiktok')" :key="media.id">
                                    <div class="bg-gray-900 p-3 rounded-xl flex flex-col space-y-2 text-xs">
                                        <div class="flex justify-between items-center">
                                            <span class="font-medium text-white truncate max-w-[170px]" x-text="media.name"></span>
                                            <button @click="deleteMedia(media.id)" class="text-red-400 hover:text-red-300 text-sm p-1">✕</button>
                                        </div>
                                        <div class="flex space-x-2 pt-1 border-t border-gray-800">

                                        </div>
                                        <div class="flex space-x-2 pt-1 border-t border-gray-800">

        </template>
    </main>

    <template x-if="showRenameModal">

                    <h3 class="text-xl font-bold" x-text="renameType === 'project' ? 'Modifier le nom du projet' : 'Modifier le nom de l\'épisode'"></h3>

                </div>

                <div class="flex justify-end space-x-3 pt-2">

                    <button @click="confirmRename()" class="px-5 py-2.5 text-xs font-semibold bg-blue-600 hover:bg-blue-500 rounded-xl text-white transition shadow-lg shadow-blue-600/20">Enregistrer</button>

    <!-- LOGIQUE JAVASCRIPT AVEC CHARGEMENT RESILIENT DES SCRIPTS -->
    <script>
        function appData() {
            return {
                isLoading: true,
                currentView: 'dashboard',
                projects: JSON.parse(localStorage.getItem('vmax_projects') || '[]'),
                currentProject: null,
                currentEpisode: null,
                activeSeasonId: null,
                showNewProjectModal: false,
                newProjectTitle: '',
                newProjectType: 'serie',
                
                showRenameModal: false,
                renameType: '',
                renameTarget: null,
                renameInputVal: '',

                copiedScript: false,
                copiedPrompts: false,
                showPreviewModal: false,
                previewMediaItem: null,
                touchStartX: 0,
                touchStartY: 0,

                initApp() {
                    setTimeout(() => {
                        this.isLoading = false;
                    }, 1600);

                    window.addEventListener('touchstart', (e) => {
                        this.touchStartX = e.touches[0].clientX;
                        this.touchStartY = e.touches[0].clientY;
                    }, { passive: true });

                    window.addEventListener('touchend', (e) => {
                        const touchEndX = e.changedTouches[0].clientX;
                        const touchEndY = e.changedTouches[0].clientY;
                        const diffX = touchEndX - this.touchStartX;
                        const diffY = Math.abs(touchEndY - this.touchStartY);

                        if (this.touchStartX < 50 && diffX > 80 && diffY < 60) {
                            this.goBack();
                        }
                    }, { passive: true });
                },

                goBack() {
                    if (this.currentView === 'episodeDetail') {
                        this.currentView = 'projectDetail';
                    } else if (this.currentView === 'projectDetail') {
                        this.currentView = 'dashboard';
                    }
                },

                saveData() {
                    localStorage.setItem('vmax_projects', JSON.stringify(this.projects));
                },

                // Fonction pour charger JSZip dynamiquement à la demande (résistant aux mauvaises connexions 3G)
                loadJSZipLibrary() {
                    return new Promise((resolve, reject) => {
                        if (window.JSZip) {
                            resolve(window.JSZip);
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
                        script.onload = () => resolve(window.JSZip);
                        script.onerror = () => reject(new Error("Impossible de télécharger le module de compression. Vérifiez votre connexion internet."));
                        document.head.appendChild(script);
                    });
                },

                // EXPORTATION SÉCURISÉE EN .ZIP (CHARGÉE À LA VOLÉE)
                async exportData() {
                    try {
                        const JSZip = await this.loadJSZipLibrary();
                        const zip = new JSZip();
                        const projectsExport = JSON.parse(JSON.stringify(this.projects));
                        const mediaFolder = zip.folder("media");

                        for (const proj of projectsExport) {
                            for (const season of proj.seasons) {
                                for (const ep of season.episodes) {
                                    for (let i = 0; i < ep.mediaAssets.length; i++) {
                                        const media = ep.mediaAssets[i];
                                        if (media.url && media.url.startsWith('data:')) {
                                            const base64Data = media.url.split(',')[1];
                                            const ext = media.name.split('.').pop() || 'bin';
                                            const fileName = `media_${media.id}_${i}.${ext}`;
                                            mediaFolder.file(fileName, base64Data, {base64: true});
                                            media.filePath = `media/${fileName}`;
                                            delete media.url;
                                        }
                                    }
                                }
                            }
                        }

                        zip.file("data.json", JSON.stringify(projectsExport, null, 2));

                        const content = await zip.generateAsync({type: "blob"});
                        const downloadAnchor = document.createElement('a');
                        downloadAnchor.href = URL.createObjectURL(content);
                        downloadAnchor.download = "vmax_backup_" + Date.now() + ".zip";
                        document.body.appendChild(downloadAnchor);
                        downloadAnchor.click();
                        downloadAnchor.remove();
                    } catch (err) {
                        alert(err.message || "Erreur lors de la création de l'archive ZIP.");
                    }
                },

                // IMPORTATION SÉCURISÉE (.ZIP OU .JSON)
                async importData(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    try {
                        if (file.name.endsWith('.zip')) {
                            const JSZip = await this.loadJSZipLibrary();
                            const zip = new JSZip();
                            const zipContent = await zip.loadAsync(file);

                            if (!zipContent.files["data.json"]) {
                                alert("Fichier data.json introuvable dans l'archive ZIP.");
                                return;
                            }

                            const jsonStr = await zipContent.files["data.json"].async("string");
                            const projectsData = JSON.parse(jsonStr);

                            for (const proj of projectsData) {
                                for (const season of proj.seasons) {
                                    for (const ep of season.episodes) {
                                        for (const media of ep.mediaAssets) {
                                            if (media.filePath && zipContent.files[media.filePath]) {
                                                const blobData = await zipContent.files[media.filePath].async("blob");
                                                media.url = await this.blobToBase64(blobData);
                                                delete media.filePath;
                                            }
                                        }
                                    }
                                }
                            }

                            this.projects = projectsData;
                            this.saveData();
                            alert('Sauvegarde ZIP restaurée avec succès ! Tous les médias sont liés.');
                        } else if (file.name.endsWith('.json')) {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                this.projects = JSON.parse(e.target.result);
                                this.saveData();
                                alert('Données JSON importées avec succès !');
                            };
                            reader.readAsText(file);
                        } else {
                            alert('Format de fichier non pris en charge.');
                        }
                    } catch (err) {
                        alert("Erreur lors de la lecture du fichier de sauvegarde.");
                    }
                    event.target.value = '';
                },

                blobToBase64(blob) {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                    });
                },

                formatType(type) {
                    const maps = {
                        'serie': 'Série entière',
                        'mini_serie': 'Mini-série',
                        'court_metrage': 'Court-métrage',
                        'long_metrage': 'Long-métrage'
                    };
                    return maps[type] || type;
                },

                createProject() {
                    if (!this.newProjectTitle.trim()) return;
                    
                    const newProj = {
                        id: Date.now().toString(),
                        title: this.newProjectTitle,
                        type: this.newProjectType,
                        seasons: []
                    };

                    if (this.newProjectType === 'serie' || this.newProjectType === 'mini_serie') {
                        newProj.seasons.push({
                            id: 's_' + Date.now(),
                            seasonNumber: 1,
                            episodes: [
                                {
                                    id: 'e_' + Date.now(),
                                    episodeNumber: 1,
                                    title: 'Épisode 1',
                                    script: '',
                                    prompts: '',
                                    mediaAssets: []
                                }
                            ]
                        });
                    } else {
                        newProj.seasons.push({
                            id: 's_film_' + Date.now(),
                            seasonNumber: 1,
                            episodes: [
                                {
                                    id: 'e_film_' + Date.now(),
                                    episodeNumber: 1,
                                    title: this.newProjectTitle,
                                    script: '',
                                    prompts: '',
                                    mediaAssets: []
                                }
                            ]
                        });
                    }

                    this.projects.push(newProj);
                    this.saveData();
                    this.newProjectTitle = '';
                    this.showNewProjectModal = false;
                },

                deleteProject(id) {
                    if (confirm('Voulez-vous vraiment supprimer ce projet ?')) {
                        this.projects = this.projects.filter(p => p.id !== id);
                        this.saveData();
                    }
                },

                openRenameModal(type, target) {
                    this.renameType = type;
                    this.renameTarget = target;
                    this.renameInputVal = target.title;
                    this.showRenameModal = true;
                },

                confirmRename() {
                    if (this.renameInputVal && this.renameInputVal.trim()) {
                        this.renameTarget.title = this.renameInputVal.trim();
                        this.saveData();
                    }
                    this.showRenameModal = false;
                    this.renameTarget = null;
                },

                deleteSeason(projectId, seasonId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        if (project.seasons.length <= 1) {
                            alert("Impossible de supprimer la seule saison restante.");
                            return;
                        }
                        if (confirm("Voulez-vous vraiment supprimer cette saison et tous ses épisodes ?")) {
                            project.seasons = project.seasons.filter(s => s.id !== seasonId);
                            this.activeSeasonId = project.seasons[0].id;
                            this.saveData();
                        }
                    }
                },

                deleteEpisode(projectId, seasonId, episodeId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        const season = project.seasons.find(s => s.id === seasonId);
                        if (season) {
                            if (season.episodes.length <= 1) {
                                alert("Impossible de supprimer le seul épisode restant de cette saison.");
                                return;
                            }
                            if (confirm("Voulez-vous vraiment supprimer cet épisode ?")) {
                                season.episodes = season.episodes.filter(e => e.id !== episodeId);
                                this.saveData();
                            }
                        }
                    }
                },

                openProject(project) {
                    this.currentProject = project;
                    if (project.seasons && project.seasons.length > 0) {
                        this.activeSeasonId = project.seasons[0].id;
                    }
                    this.currentView = 'projectDetail';
                },

                getActiveSeason() {
                    if (!this.currentProject || !this.currentProject.seasons) return null;
                    return this.currentProject.seasons.find(s => s.id === this.activeSeasonId) || this.currentProject.seasons[0];
                },

                openMovieWorkspace(project) {
                    if (project.seasons[0] && project.seasons[0].episodes[0]) {
                        this.currentEpisode = project.seasons[0].episodes[0];
                        this.currentView = 'episodeDetail';
                    }
                },

                addSeason(projectId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        const nextSeasonNum = project.seasons.length + 1;
                        const newSeasonId = 's_' + Date.now();
                        project.seasons.push({
                            id: newSeasonId,
                            seasonNumber: nextSeasonNum,
                            episodes: [
                                {
                                    id: 'e_' + Date.now(),
                                    episodeNumber: 1,
                                    title: 'Épisode 1',
                                    script: '',
                                    prompts: '',
                                    mediaAssets: []
                                }
                            ]
                        });
                        this.activeSeasonId = newSeasonId;
                        this.saveData();
                    }
                },

                addEpisode(projectId, seasonId) {
                    const project = this.projects.find(p => p.id === projectId);
                    if (project) {
                        const season = project.seasons.find(s => s.id === seasonId);
                        if (season) {
                            const nextEpNum = season.episodes.length + 1;
                            season.episodes.push({
                                id: 'e_' + Date.now(),
                                episodeNumber: nextEpNum,
                                title: 'Épisode ' + nextEpNum,
                                script: '',
                                prompts: '',
                                mediaAssets: []
                            });
                            this.saveData();
                        }
                    }
                },

                openEpisode(episode) {
                    this.currentEpisode = episode;
                    this.currentView = 'episodeDetail';
                },

                copyText(text, type) {
                    navigator.clipboard.writeText(text || '');
                    if (type === 'script') {
                        this.copiedScript = true;
                        setTimeout(() => this.copiedScript = false, 2000);
                    } else {
                        this.copiedPrompts = true;
                        setTimeout(() => this.copiedPrompts = false, 2000);
                    }
                },

                addMedia(event, format) {
                    const file = event.target.files[0];
                    if (!file) return;

                    let type = 'video';
                    if (file.type.includes('audio')) type = 'audio';
                    else if (file.type.includes('image')) type = 'image';

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const base64Url = e.target.result;
                        this.currentEpisode.mediaAssets.push({
                            id: 'm_' + Date.now(),
                            name: file.name,
                            type: type,
                            format: format,
                            url: base64Url
                        });
                        this.saveData();
                    };
                    reader.readAsDataURL(file);
                    event.target.value = '';
                },

                deleteMedia(mediaId) {
                    this.currentEpisode.mediaAssets = this.currentEpisode.mediaAssets.filter(m => m.id !== mediaId);
                    this.saveData();
                },

                previewMedia(media) {
                    this.previewMediaItem = media;
                    this.showPreviewModal = true;
                },

                closePreview() {
                    this.showPreviewModal = false;
                    this.previewMediaItem = null;
                },

                mediaIcon(type) {
                    if (type === 'video') return '🎥';
                    if (type === 'audio') return '🎵';
                    return '🖼️';
                }
            }
        }
    </script>
